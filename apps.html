<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apps — RoCheats</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Replace this with your actual favicon link -->
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Sunblo/RoCheats/refs/heads/main/Images/RoCheatsLogo.png">
<style>
  :root{
    --bg:#0a0a0c;
    --fg:#f5f5f7;
    --muted:#8a8a94;
    --accent:#ff2d55;
    --border:rgba(255,255,255,0.08);
    --card:rgba(255,255,255,0.02);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Manrope',sans-serif;
    background:var(--bg);
    color:var(--fg);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* Page transition fade out */
  body.fade-out{opacity:0; transition:opacity 0.4s ease;}
  
  .font-display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.02em}

  /* Subtle background grid */
  .bg-grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse at center,#000 0%,transparent 70%);
    -webkit-mask-image:radial-gradient(ellipse at center,#000 0%,transparent 70%);
  }

  /* Navigation */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    padding:24px 5vw;display:flex;align-items:center;justify-content:space-between;
    background:rgba(10,10,12,0.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
    transition:padding 0.3s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s;
    transform:translateY(-100%);
  }
  body.loaded nav{transform:translateY(0);}
  nav.scrolled{padding:16px 5vw}
  .nav-logo{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;
    display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);
  }
  .nav-links{display:flex;align-items:center;gap:32px;list-style:none}
  .nav-link{
    font-size:14px;font-weight:500;color:var(--muted);
    text-decoration:none;transition:color 0.2s;position:relative;
  }
  .nav-link:hover{color:var(--fg)}
  .nav-link.active{color:var(--fg)}
  .nav-link.active::after{
    content:'';position:absolute;bottom:-6px;left:0;right:0;height:2px;
    background:var(--accent);border-radius:2px;
  }
  .nav-cta{
    padding:10px 18px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;
    border-radius:8px;text-decoration:none;transition:transform 0.2s,background 0.2s;
    display:flex;align-items:center;gap:8px;
  }
  .nav-cta:hover{background:#ff1640;transform:translateY(-1px)}
  .mobile-toggle{display:none;background:none;border:none;color:var(--fg);font-size:22px;cursor:pointer}

  /* Main Content */
  main{
    position:relative;z-index:1;
    opacity:0;
    transform:translateY(40px);
    transition:opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  body.loaded main{
    opacity:1;
    transform:translateY(0);
  }

  /* Page Header */
  .page-header {
    padding: 160px 5vw 40px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .page-header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(36px, 6vw, 64px);
    font-weight: 700;
    letter-spacing: -0.04em;
    margin-bottom: 12px;
  }
  .page-header p {
    color: var(--muted);
    font-size: 16px;
    max-width: 500px;
  }

  /* Apps Grid */
  .apps-container {
    padding: 40px 5vw 100px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .apps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
  }

  /* App Card Link & Template */
  .app-card-link {
    text-decoration: none;
    color: inherit;
    display: flex;
  }
  .app-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    width: 100%;
  }
  .app-card:hover {
    border-color: rgba(255,45,85,0.3);
    transform: translateY(-4px);
  }
  .app-thumb {
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .app-thumb i {
    font-size: 48px;
    color: #fff;
    opacity: 0.9;
  }
  .app-info {
    padding: 24px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .app-info h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .app-info p {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 24px;
    flex: 1;
    line-height: 1.5;
  }
  .app-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .price {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
  }
  .price span {
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    margin-right: 2px;
  }
  .btn-small {
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--fg);
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .app-card:hover .btn-small {
    background: var(--accent);
    border-color: var(--accent);
  }

  /* Mobile */
  @media (max-width:768px){
    .nav-links{display:none}
    .mobile-toggle{display:block}
    .nav-cta span{display:none}
  }
</style>
</head>
<body>

<!-- Background -->
<div class="bg-grid"></div>

<!-- Nav -->
<nav id="navbar">
  <a href="index.html" class="nav-logo">
    <!-- Replace src with your actual logo image URL -->
    <img src="https://raw.githubusercontent.com/Sunblo/RoCheats/refs/heads/main/Images/RoCheatsLogo.png" alt="RoCheats Logo" style="height: 39px; width: 39px; border-radius: 6px; object-fit: cover;"> 
    RoCheats
  </a>
  <ul class="nav-links">
    <li><a href="index.html" class="nav-link">Home</a></li>
    <li><a href="scripts.html" class="nav-link">Scripts</a></li>
    <li><a href="apps.html" class="nav-link active">Apps</a></li>
    <li><a href="videos.html" class="nav-link">Videos</a></li>
  </ul>
  <a href="#" class="nav-cta" onclick="event.preventDefault()">
    <i class="fab fa-discord"></i> <span>Join Discord</span>
  </a>
  <button class="mobile-toggle"><i class="fas fa-bars"></i></button>
</nav>

<!-- Content -->
<main>
  <section class="page-header">
    <h1 class="font-display">Standalone Apps</h1>
    <p>Powerful desktop applications designed to supercharge your Roblox development and gameplay experience.</p>
  </section>

  <section class="apps-container">
    <div class="apps-grid">
      
      <!-- APP CARD TEMPLATE START -->
      <!-- Copy this entire <a> block to add a new app -->
      <a href="apps/TestApp.html" class="app-card-link">
        <div class="app-card">
          <div class="app-thumb" style="background: linear-gradient(135deg, #5a1fff, #00e5ff);">
            <i class="fas fa-code"></i>
          </div>
          <div class="app-info">
            <h3>Test App</h3>
            <p>idk what to put here</p>
            <div class="app-footer">
              <div class="price"><span>$</span>999999999</div>
              <div class="btn-small">Get App <i class="fas fa-arrow-right"></i></div>
            </div>
          </div>
        </div>
      </a>
      <!-- APP CARD TEMPLATE END -->

    </div>
  </section>
</main>

<script>
  // Intro sequence
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.body.classList.add('loaded');
    }, 100); 
  });

  // Navbar scroll effect
  window.addEventListener('scroll', () => {
    document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 30);
  });

  // Page transition (fade out)
  document.querySelectorAll('a').forEach(link => {
    const href = link.getAttribute('href');
    // Check if it's an internal HTML link
    if (href && (href.endsWith('.html') || href.startsWith('./') || href.startsWith('/')) && !href.startsWith('#')) {
      link.addEventListener('click', e => {
        e.preventDefault();
        document.body.classList.add('fade-out');
        setTimeout(() => {
          window.location.href = href;
        }, 400); // Wait for fade out to finish
      });
    }
  });
</script>

</body>
</html>
