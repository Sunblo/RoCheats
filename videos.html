<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Sunblo/RoCheats/refs/heads/main/Images/RoCheatsLogo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos — RoCheats</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --bg:#0a0a0c;
    --fg:#f5f5f7;
    --muted:#8a8a94;
    --accent:#ff2d55;
    --border:rgba(255,255,255,0.08);
    --card:rgba(255,255,255,0.02);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Manrope',sans-serif;
    background:var(--bg);
    color:var(--fg);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body.fade-out{opacity:0; transition:opacity 0.4s ease;}
  
  .font-display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.02em}

  .bg-grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse at center,#000 0%,transparent 70%);
    -webkit-mask-image:radial-gradient(ellipse at center,#000 0%,transparent 70%);
  }

  /* Navigation */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    padding:24px 5vw;display:flex;align-items:center;justify-content:space-between;
    background:rgba(10,10,12,0.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
    transition:padding 0.3s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s;
    transform:translateY(-100%);
  }
  body.loaded nav{transform:translateY(0);}
  nav.scrolled{padding:16px 5vw}
  .nav-logo{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;
    display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);
  }
  .nav-logo i{color:var(--accent)}
  .nav-links{display:flex;align-items:center;gap:32px;list-style:none}
  .nav-link{
    font-size:14px;font-weight:500;color:var(--muted);
    text-decoration:none;transition:color 0.2s;position:relative;
  }
  .nav-link:hover{color:var(--fg)}
  .nav-link.active{color:var(--fg)}
  .nav-link.active::after{
    content:'';position:absolute;bottom:-6px;left:0;right:0;height:2px;
    background:var(--accent);border-radius:2px;
  }
  .nav-cta{
    padding:10px 18px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;
    border-radius:8px;text-decoration:none;transition:transform 0.2s,background 0.2s;
    display:flex;align-items:center;gap:8px;
  }
  .nav-cta:hover{background:#ff1640;transform:translateY(-1px)}
  .mobile-toggle{display:none;background:none;border:none;color:var(--fg);font-size:22px;cursor:pointer}

  main{
    position:relative;z-index:1;
    opacity:0;
    transform:translateY(40px);
    transition:opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  body.loaded main{
    opacity:1;
    transform:translateY(0);
  }

  /* Page Header */
  .page-header {
    padding: 160px 5vw 40px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .page-header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(36px, 6vw, 64px);
    font-weight: 700;
    letter-spacing: -0.04em;
    margin-bottom: 12px;
  }
  .page-header p {
    color: var(--muted);
    font-size: 16px;
    max-width: 500px;
  }

  /* Videos Grid */
  .videos-container {
    padding: 40px 5vw 100px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .videos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
  }

  /* Video Card */
  .video-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .video-card:hover {
    border-color: rgba(255,45,85,0.3);
    transform: translateY(-4px);
  }
  .video-thumb {
    height: 180px;
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .video-thumb::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.4);
    transition: background 0.3s;
  }
  .video-card:hover .video-thumb::after {
    background: rgba(0,0,0,0.2);
  }
  .play-icon {
    position: relative;
    z-index: 2;
    width: 56px;
    height: 56px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }
  .play-icon i {
    color: #fff;
    font-size: 20px;
    margin-left: 3px; /* visual centering */
  }
  .video-card:hover .play-icon {
    background: var(--accent);
    transform: scale(1.1);
  }
  .video-info {
    padding: 20px;
  }
  .video-info h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .video-info p {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* Modal Player */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    z-index: 9998;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 5vw;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .modal-overlay.active {
    display: flex;
    opacity: 1;
  }
  .modal-content {
    position: relative;
    width: 100%;
    max-width: 900px;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transform: scale(0.95);
    transition: transform 0.3s ease;
  }
  .modal-overlay.active .modal-content {
    transform: scale(1);
  }
  .modal-video {
    width: 100%;
    max-height: 80vh;
    display: block;
    outline: none;
  }
  .modal-close {
    position: absolute;
    top: -40px;
    right: 0;
    background: none;
    border: none;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  .modal-close:hover { opacity: 1; }

  /* Mobile */
  @media (max-width:768px){
    .nav-links{display:none}
    .mobile-toggle{display:block}
    .nav-cta span{display:none}
  }
</style>
</head>
<body>

<!-- Background -->
<div class="bg-grid"></div>

<!-- Nav -->
<nav id="navbar">
  <a href="index.html" class="nav-logo">
    <i class="fas fa-bolt"></i> RoCheats
  </a>
  <ul class="nav-links">
    <li><a href="index.html" class="nav-link">Home</a></li>
    <li><a href="scripts.html" class="nav-link">Scripts</a></li>
    <li><a href="apps.html" class="nav-link">Apps</a></li>
    <li><a href="videos.html" class="nav-link active">Videos</a></li>
  </ul>
  <a href="#" class="nav-cta" onclick="event.preventDefault()">
    <i class="fab fa-discord"></i> <span>Join Discord</span>
  </a>
  <button class="mobile-toggle"><i class="fas fa-bars"></i></button>
</nav>

<!-- Content -->
<main>
  <section class="page-header">
    <h1 class="font-display">Showcases</h1>
  </section>

  <section class="videos-container">
    <div class="videos-grid">
      
      <!-- VIDEO CARD TEMPLATE START -->
      <!-- Copy this block to add a new video -->
      <div class="video-card" data-video="videos/showcase1.mp4">
        <!-- You can use a local image or a direct link for the thumbnail -->
        <div class="video-thumb" style="background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070&auto=format&fit=crop');">
          <div class="play-icon"><i class="fas fa-play"></i></div>
        </div>
        <div class="video-info">
          <h3>Kiciahook rivals skin changer showcase</h3>
        </div>
      </div>
      <!-- VIDEO CARD TEMPLATE END -->

    </div>
  </section>
</main>

<!-- Video Modal -->
<div class="modal-overlay" id="videoModal">
  <div class="modal-content">
    <button class="modal-close" id="closeModal"><i class="fas fa-times"></i></button>
    <video class="modal-video" id="modalVideo" controls>
      Your browser does not support the video tag.
    </video>
  </div>
</div>

<script>
  // Intro sequence
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.body.classList.add('loaded');
    }, 100); 
  });

  // Navbar scroll effect
  window.addEventListener('scroll', () => {
    document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 30);
  });

  // Page transition (fade out)
  document.querySelectorAll('a').forEach(link => {
    const href = link.getAttribute('href');
    if (href && (href.endsWith('.html') || href.startsWith('./') || href.startsWith('/')) && !href.startsWith('#')) {
      link.addEventListener('click', e => {
        // Don't trigger fade out if we are opening a video (handled separately)
        if (link.closest('.video-card')) return;
        
        e.preventDefault();
        document.body.classList.add('fade-out');
        setTimeout(() => {
          window.location.href = href;
        }, 400);
      });
    }
  });

  // Video Modal Logic
  const modal = document.getElementById('videoModal');
  const modalVideo = document.getElementById('modalVideo');
  const closeModal = document.getElementById('closeModal');

  document.querySelectorAll('.video-card').forEach(card => {
    card.addEventListener('click', () => {
      const videoSrc = card.getAttribute('data-video');
      modalVideo.src = videoSrc;
      modal.classList.add('active');
      modalVideo.play(); // Autoplay when opened
    });
  });

  function closeVideoModal() {
    modal.classList.remove('active');
    modalVideo.pause();
    modalVideo.removeAttribute('src'); // Clear src to stop download
    modalVideo.load();
  }

  closeModal.addEventListener('click', closeVideoModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      closeVideoModal();
    }
  });

  // Close on ESC key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('active')) {
      closeVideoModal();
    }
  });
</script>

</body>
</html>
